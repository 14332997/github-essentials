name: Collaborative Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Update index.html for Team Leader
        if: github.actor == '14332997'
        run: |
          echo "<p>Updated by Team Leader on $(date)</p>" >> index.html

      - name: Update README
        run: |
          echo "### Updated by ${{ github.actor }} on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md